[workspace]
resolver = "2"
members = [
    "crates/cube",
    "crates/scramble",
    "crates/stats",
    "crates/store",
    "crates/tuibik-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["tuibik contributors"]
repository = ""

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"

# min2phase prints table-build and solve progress to stdout when built with
# debug assertions, which corrupts the TUI. Keep it (and speed it up) in dev.
[profile.dev.package.min2phase]
debug-assertions = false
opt-level = 3
