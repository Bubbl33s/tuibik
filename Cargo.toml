[workspace]
resolver = "2"
members = [
    "crates/cube",
    "crates/scramble",
    "crates/stats",
    "crates/store",
    "crates/tuibik-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["tuibik contributors"]
description = "A csTimer-style terminal user interface for timing Rubik's Cube solves"
repository = "https://github.com/Bubbl33s/tuibik"
homepage = "https://github.com/Bubbl33s/tuibik"
documentation = "https://github.com/Bubbl33s/tuibik#readme"
keywords = ["rubiks-cube", "speedcubing", "timer", "tui"]
categories = ["command-line-utilities"]

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"

# min2phase prints table-build and solve progress to stdout when built with
# debug assertions, which corrupts the TUI. Keep it (and speed it up) in dev.
[profile.dev.package.min2phase]
debug-assertions = false
opt-level = 3
